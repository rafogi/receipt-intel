name: tests

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "eval/**"
      - "web/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "eval/**"
      - "web/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the Lambda runtime (python3.13 in infra/modules/python_lambda).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r services/pipeline/requirements-dev.txt

      - name: Test
        run: python -m pytest services/pipeline -q -p no:cacheprovider

  web:
    name: web app tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      # Includes the TypeScript check.
      - run: npm run build
